<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Processing</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Hind Siliguri', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
    background: linear-gradient(-45deg, #07152f, #102c58, #301b63, #073b4c);
    background-size: 400% 400%;
    animation: backgroundMove 10s ease infinite;
    color: white;
}

@keyframes backgroundMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(3px);
    opacity: .35;
    animation: float 6s ease-in-out infinite;
}

.orb1 {
    width: 180px;
    height: 180px;
    background: #00e5ff;
    top: 8%;
    left: -60px;
}

.orb2 {
    width: 220px;
    height: 220px;
    background: #a855f7;
    bottom: 3%;
    right: -70px;
    animation-delay: -3s;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-25px); }
}

.card {
    width: 100%;
    max-width: 400px;
    padding: 38px 24px;
    text-align: center;
    position: relative;
    z-index: 2;
    border-radius: 28px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    animation: appear .8s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.icon-area {
    width: 115px;
    height: 115px;
    margin: 0 auto 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 2px solid transparent;
    border-top-color: #36e5ff;
    border-right-color: #36e5ff;
    border-radius: 50%;
    animation: spin 1.5s linear infinite;
}

.ring2 {
    width: 82px;
    height: 82px;
    border-top-color: #b78aff;
    border-left-color: #b78aff;
    border-right-color: transparent;
    animation: spin 2s linear infinite reverse;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.money {
    font-size: 42px;
    font-weight: 700;
    color: #71edff;
    text-shadow: 0 0 20px rgba(54,229,255,.7);
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.badge {
    display: inline-block;
    padding: 7px 15px;
    border-radius: 30px;
    background: rgba(255,190,50,.13);
    border: 1px solid rgba(255,190,50,.35);
    color: #ffd36b;
    font-size: 13px;
    margin-bottom: 18px;
}

.dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #ffc94f;
    border-radius: 50%;
    margin-right: 6px;
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: .2; }
}

h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #fff, #76eaff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.description {
    color: #d1dcf2;
    font-size: 15px;
    line-height: 1.9;
    margin-bottom: 28px;
}

.progress-box {
    padding: 17px;
    border-radius: 15px;
    background: rgba(0,0,0,.17);
    border: 1px solid rgba(255,255,255,.08);
}

.progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #d9e5ff;
    margin-bottom: 12px;
}

.progress-top span:last-child {
    color: #67e8f9;
}

.progress {
    width: 100%;
    height: 7px;
    background: rgba(255,255,255,.12);
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 35%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #24d7ff, #a78bfa);
    box-shadow: 0 0 12px #24d7ff;
    animation: loading 2s ease-in-out infinite alternate;
}

@keyframes loading {
    from { width: 20%; }
    to { width: 90%; }
}

.footer {
    margin-top: 23px;
    color: #9eafd0;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<main class="card">

    <div class="icon-area">
        <div class="ring"></div>
        <div class="ring ring2"></div>
        <div class="money">৳</div>
    </div>

    <div class="badge">
        <span class="dot"></span>
        PROCESSING
    </div>

    <h1>পেমেন্ট প্রসেসিং হচ্ছে</h1>

    <p class="description">
        সবাই ধৈর্য সহকারে অপেক্ষা করুন।
    </p>

    <div class="progress-box">
        <div class="progress-top">
            <span>পেমেন্ট স্ট্যাটাস</span>
            <span>প্রসেসিং...</span>
        </div>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="footer">
        Payment Processing
    </div>

</main>

</body>
</html>
